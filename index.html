<style>
  :root{ --teal:#00A0AC; --amber:#F5B301; --green:#2E9E5B; --orange:#E4572E; --ink:#1e293b; --muted:#64748b; --line:#eef1f4; --bg:#f1f5f9; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);-webkit-tap-highlight-color:transparent;}
  #app{max-width:430px;margin:0 auto;min-height:100vh;background:#fff;position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.08);}
  header{background:var(--teal);padding:18px 16px 14px;display:flex;align-items:center;justify-content:space-between;}
  header h1{color:#fff;font-size:19px;margin:0;font-weight:800;letter-spacing:-.2px;}
  .icon-btn{background:none;border:none;padding:6px;cursor:pointer;display:flex;align-items:center;color:inherit;}
  .badge-circle{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
  .notif-dot{position:absolute;top:2px;right:2px;width:9px;height:9px;background:#E4572E;border-radius:50%;border:2px solid var(--teal);}
  .refresh-row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);}
  .refresh-row b{color:var(--ink);}
  .refresh-btn{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);background:#f1f5f9;border:none;border-radius:8px;padding:7px 10px;cursor:pointer;}
  .refresh-btn.spin svg{animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);}
  .tab{border:none;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;cursor:pointer;position:relative;opacity:.85;font-family:inherit;}
  .tab.active{opacity:1;}
  .tab.active::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.85);}
  .tab span{font-size:9.5px;font-weight:800;text-align:center;line-height:1.2;}
  .tab .count{position:absolute;top:4px;right:8px;background:rgba(255,255,255,.92);border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  main{flex:1;padding:16px;min-height:340px;}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-top:60px;color:#94a3b8;}
  .empty span{font-size:14px;font-weight:600;}
  .card{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .worker{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink);}
  .date{font-size:10px;color:#94a3b8;}
  .dept{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .items{font-size:12px;color:#475569;margin:0 0 8px 0;padding-left:0;list-style:none;}
  .items li{padding:1px 0;}
  .motivo{font-size:11px;color:#64748b;font-style:italic;margin-bottom:6px;}
  .foto-thumb{width:100%;max-height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;}
  .actions{display:flex;gap:8px;}
  .actions button{flex:1;border:none;color:#fff;font-weight:700;font-size:12px;padding:8px;border-radius:10px;cursor:pointer;}
  footer.tabbar{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 14px;color:var(--teal);font-size:11px;font-weight:700;}
  #fab-slot{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:10px;padding:0 20px 20px;pointer-events:none;}
  #fab-slot button{pointer-events:auto;width:56px;height:56px;border-radius:50%;background:var(--teal);border:none;color:#fff;font-size:26px;box-shadow:0 6px 16px rgba(0,160,172,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{background:#fff;width:100%;max-width:430px;border-radius:24px 24px 0 0;padding:18px 16px 26px;max-height:88vh;overflow-y:auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .sheet-head h2{font-size:16px;margin:0;color:var(--ink);}
  label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}
  input[type=text],input[type=email],input[type=password],input[type=file],textarea{width:100%;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-family:inherit;}
  textarea{resize:vertical;min-height:60px;}
  input:focus,textarea:focus{outline:none;border-color:var(--teal);}
  .item-row{display:flex;align-items:center;justify-content:space-between;border:1px solid #e2e8f0;border-radius:12px;padding:9px 10px;margin-bottom:8px;flex-wrap:wrap;}
  .item-row.active{border-color:#5fc4cc;background:#eafafb;}
  .item-row .name{font-size:13px;font-weight:600;color:#334155;}
  .item-row .stock{font-size:10px;color:#94a3b8;}
  .qty-ctrl{display:flex;align-items:center;gap:8px;}
  .qty-ctrl button{width:24px;height:24px;border-radius:50%;border:none;background:#f1f5f9;cursor:pointer;font-weight:700;}
  .qty-ctrl span{font-size:13px;font-weight:700;width:16px;text-align:center;}
  .submit-btn{width:100%;border:none;color:#fff;font-weight:700;padding:13px;border-radius:14px;font-size:14px;cursor:pointer;margin-top:6px;}
  .submit-btn:disabled{background:#cbd5e1!important;cursor:not-allowed;}
  .side-menu{position:fixed;inset:0;z-index:60;display:flex;}
  .side-panel{width:250px;height:100%;background:#fff;padding:16px;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(0,0,0,.1);}
  .menu-item{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:12px;border:none;background:none;width:100%;text-align:left;font-size:13px;font-weight:600;color:#334155;cursor:pointer;}
  .menu-item:hover{background:#f8fafc;}
  .side-backdrop{flex:1;background:rgba(0,0,0,.3);}
  .role-chip{display:inline-block;font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;background:#f1f5f9;color:#475569;margin-top:4px;}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#00A0AC,#00707a);padding:20px;}
  .auth-card{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);}
  .auth-card h1{font-size:20px;margin:0 0 4px;color:var(--ink);text-align:center;}
  .auth-card p.sub{font-size:12px;color:#94a3b8;text-align:center;margin:0 0 20px;}
  .auth-tabs{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:18px;}
  .auth-tabs button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-size:13px;font-weight:700;color:#64748b;cursor:pointer;}
  .auth-tabs button.active{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.1);}
  .auth-error{background:#fdeae4;color:#c0391a;font-size:12px;padding:9px 12px;border-radius:10px;margin-bottom:12px;}
  .auth-ok{background:#e6f6ec;color:#1d7a41;font-size:12px;padding:9px 12px;border-radius:10px;margin-bottom:12px;}
  .link-btn{background:none;border:none;color:var(--teal);font-size:12px;font-weight:700;cursor:pointer;text-align:center;width:100%;margin-top:10px;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;}
  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:13px;}
  .inv-admin-row{display:flex;gap:8px;margin-bottom:10px;}
  .inv-admin-row input{margin-bottom:0;}
</style>

<script>

  building:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/></svg>`,

  bell:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
  download:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00A0AC" stroke-width="2"><path d="M12 15V3M7 10l5 5 5-5M5 21h14"/></svg>`,

  logout:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>`,
};

/* ================= STATE ================= */
let session = null, profile = null;
let view = "loading"; // loading | login | signup | forgot | app
let authError = "", authOk = "", authLoading = false;
let signupData = { nombre:"", rut:"", departamento:"", email:"", password:"" };
let loginData = { email:"", password:"" };
let forgotEmail = "";

let tab = "espera";
let solicitudes = [], inventory = [], notifications = [];
let lastUpdate = "";
let menuOpen = false, showInventory = false, showForm = false, showNotifs = false, spinning = false;
let showExportModal = false, exportWorker = "";
let formSelection = {}, formMotivo = "", formFotoFile = null, formFotoPreview = null;
const TALLA_OPTIONS = ["S","M","L","XL","XXL"];
const NUMERO_OPTIONS = Array.from({length:12}, (_,i)=> String(34+i));
let itemEditor = null; // null = cerrado; objeto con datos cuando está abierto

function nowStamp(){
  const d = new Date(); const p = n => String(n).padStart(2,"0");
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function itemName(id){ return inventory.find(i=>i.id===id)?.name ?? id; }
function isSupervisor(){ return profile && (profile.rol === "supervisor" || profile.rol === "administrador"); }
function isAdmin(){ return profile && profile.rol === "administrador"; }

/* ================= AUTH ================= */
async function initAuth(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session){ await loadProfile(); } else { view = "login"; }
  render();
  sb.auth.onAuthStateChange(async (event, sess) => {
    session = sess;
    if(session && !profile){ await loadProfile(); view = "app"; await loadAll(); render(); }
    if(!session){ profile = null; view = "login"; render(); }
  });
}

async function loadProfile(){
  const { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if(!error) profile = data;
  view = "app";
  await loadAll();
}

async function doSignup(){
  authError = ""; authOk = "";
  if(!signupData.nombre.trim() || !signupData.rut.trim() || !signupData.email.trim() || signupData.password.length < 6){
    authError = "Completa todos los campos (contraseña mínimo 6 caracteres)."; render(); return;
  }
  authLoading = true; render();
  const { error } = await sb.auth.signUp({
    email: signupData.email.trim(), password: signupData.password,
    options: { data: { nombre: signupData.nombre.trim(), rut: signupData.rut.trim(), departamento: signupData.departamento.trim() } }
  });
  authLoading = false;
  if(error){ authError = traducirError(error.message); render(); return; }
  authOk = "Cuenta creada. Revisa tu correo para confirmar tu cuenta y luego inicia sesión.";
  view = "login";
  render();
}

async function doLogin(){
  authError = "";
  if(!loginData.email.trim() || !loginData.password){ authError = "Ingresa tu correo y contraseña."; render(); return; }
  authLoading = true; render();
  const { error } = await sb.auth.signInWithPassword({ email: loginData.email.trim(), password: loginData.password });
  authLoading = false;
  if(error){ authError = traducirError(error.message); render(); return; }
}

async function doForgot(){
  authError = ""; authOk = "";
  if(!forgotEmail.trim()){ authError = "Ingresa tu correo."; render(); return; }
  authLoading = true; render();
  const { error } = await sb.auth.resetPasswordForEmail(forgotEmail.trim());
  authLoading = false;
  if(error){ authError = traducirError(error.message); render(); return; }
  authOk = "Si el correo existe, te enviamos un link para restablecer tu contraseña.";
  view = "login"; render();
}

function traducirError(msg){
  if(/already registered/i.test(msg)) return "Ese correo ya tiene una cuenta.";
  if(/invalid login/i.test(msg)) return "Correo o contraseña incorrectos.";
  if(/email not confirmed/i.test(msg)) return "Debes confirmar tu correo antes de iniciar sesión.";
  return msg;
}

async function doLogout(){
  await sb.auth.signOut();
  session = null; profile = null; view = "login"; menuOpen = false;
  render();
}

/* ================= DATA ================= */
async function loadAll(){
  await Promise.all([loadInventory(), loadSolicitudes(), loadNotifications()]);
  lastUpdate = nowStamp();
}

async function loadInventory(){
  const { data } = await sb.from("epp_items").select("*").order("name");
  inventory = data || [];
}

async function loadSolicitudes(){
  let query = sb.from("solicitudes").select("*, solicitud_items(*)").order("created_at", { ascending:false });
  if(!isSupervisor()) query = query.eq("worker_id", session.user.id);
  const { data } = await query;
  solicitudes = data || [];
}

async function loadNotifications(){
  const { data } = await sb.from("notifications").select("*").eq("user_id", session.user.id).order("created_at",{ascending:false}).limit(30);
  notifications = data || [];
}

function subscribeRealtime(){
  sb.channel("solicitudes-changes")
    .on("postgres_changes", { event:"*", schema:"public", table:"solicitudes" }, () => { loadSolicitudes().then(render); })
    .on("postgres_changes", { event:"*", schema:"public", table:"notifications" }, () => { loadNotifications().then(render); })
    .subscribe();
}

async function refresh(){ spinning = true; render(); await loadAll(); spinning = false; render(); }
function setTab(t){ tab = t; render(); }

/* ---- Nueva solicitud ---- */
function openForm(){ showForm = true; formSelection = {}; formMotivo = ""; formFotoFile = null; formFotoPreview = null; render(); }
function closeForm(){ showForm = false; render(); }
function toggleFormItem(id){
  if(formSelection[id]) delete formSelection[id];
  else { const item = inventory.find(i=>i.id===id); formSelection[id] = { qty:1, option: item?.options ? "" : null }; }
  render();
}
function setFormQty(id, qty){ formSelection[id].qty = Math.max(1, qty); render(); }
function setFormOption(id, option){ formSelection[id].option = option; render(); }
function formIsComplete(){
  const entries = Object.entries(formSelection);
  if(entries.length===0) return false;
  return entries.every(([id, sel]) => { const item = inventory.find(i=>i.id===id); return item?.options ? !!sel.option : true; });
}
function onFotoChange(e){
  const file = e.target.files[0];
  if(!file) return;
  formFotoFile = file;
  formFotoPreview = URL.createObjectURL(file);
  render();
}
async function submitForm(){
  if(!formIsComplete()) return;
  const btn = document.getElementById("submit-form");
  if(btn){ btn.disabled = true; btn.textContent = "Enviando..."; }

  let foto_url = null;
  if(formFotoFile){
    const path = `${session.user.id}/${Date.now()}_${formFotoFile.name}`;
    const { error: upErr } = await sb.storage.from("fotos-solicitudes").upload(path, formFotoFile);
    if(!upErr){ const { data } = sb.storage.from("fotos-solicitudes").getPublicUrl(path); foto_url = data.publicUrl; }
  }

  const { data: sol, error } = await sb.from("solicitudes").insert({
    worker_id: session.user.id, worker_name: profile.nombre, department: profile.departamento || "",
    motivo: formMotivo.trim() || null, foto_url,
  }).select().single();

  if(error){ alert("Error al crear la solicitud: " + error.message); render(); return; }

  const items = Object.entries(formSelection).map(([id,sel]) => ({
    solicitud_id: sol.id, item_id: id, qty: sel.qty, option_value: sel.option || null,
  }));
  await sb.from("solicitud_items").insert(items);

  showForm = false; tab = "espera";
  await loadSolicitudes(); render();
}

/* ---- Supervisor ---- */
async function updateStatus(id, status){
  await sb.from("solicitudes").update({ status }).eq("id", id);
  await loadSolicitudes(); render();
}

/* ---- Inventario (admin) ---- */
async function adjustStock(id, delta){
  const item = inventory.find(i=>i.id===id);
  await sb.from("epp_items").update({ stock: Math.max(0, item.stock + delta) }).eq("id", id);
  await loadInventory(); render();
}

function openNewItemEditor(){
  itemEditor = { id:null, name:"", unit:"unidad", stock:0, requiresOption:false, optionType:"talla", selected:new Set() };
  render();
}
function openEditItemEditor(id){
  const item = inventory.find(i=>i.id===id);
  const isNumero = (item.option_label||"").toLowerCase().includes("número") || (item.option_label||"").toLowerCase().includes("numero");
  itemEditor = {
    id: item.id, name: item.name, unit: item.unit, stock: item.stock,
    requiresOption: !!item.options, optionType: isNumero ? "numero" : "talla",
    selected: new Set(item.options || []),
  };
  render();
}
function closeItemEditor(){ itemEditor = null; render(); }
function setEditorField(field, value){ itemEditor[field] = value; }
function setEditorRequires(val){ itemEditor.requiresOption = val; render(); }
function setEditorOptionType(type){ itemEditor.optionType = type; itemEditor.selected = new Set(); render(); }
function toggleEditorSize(val){
  if(itemEditor.selected.has(val)) itemEditor.selected.delete(val);
  else itemEditor.selected.add(val);
  render();
}
async function saveItemEditor(){
  if(!itemEditor.name.trim()){ alert("Ponle un nombre al artículo."); return; }
  if(itemEditor.requiresOption && itemEditor.selected.size === 0){ alert("Marca al menos una talla/número."); return; }
  const option_label = itemEditor.requiresOption ? (itemEditor.optionType === "numero" ? "Número de calzado" : "Talla") : null;
  const options = itemEditor.requiresOption ? Array.from(itemEditor.selected).sort() : null;
  const payload = { name: itemEditor.name.trim(), unit: itemEditor.unit.trim() || "unidad", stock: Number(itemEditor.stock) || 0, option_label, options };

  if(itemEditor.id){
    await sb.from("epp_items").update(payload).eq("id", itemEditor.id);
  } else {
    const id = itemEditor.name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40) + "-" + Date.now().toString(36);
    await sb.from("epp_items").insert({ id, ...payload });
  }
  itemEditor = null;
  await loadInventory(); render();
}
async function deleteItem(id){
  const { count } = await sb.from("solicitud_items").select("*", { count:"exact", head:true }).eq("item_id", id);
  if(count > 0){
    alert("Este artículo ya fue solicitado antes, así que no se puede eliminar (para no perder el historial). Puedes editarlo si necesitas cambiarlo.");
    return;
  }
  if(!confirm("¿Eliminar este artículo del inventario? Esta acción no se puede deshacer.")) return;
  await sb.from("epp_items").delete().eq("id", id);
  await loadInventory(); render();
}

/* ---- Notificaciones ---- */
async function openNotifs(){
  showNotifs = true; render();
  const unread = notifications.filter(n=>!n.read).map(n=>n.id);
  if(unread.length){ await sb.from("notifications").update({read:true}).in("id", unread); await loadNotifications(); render(); }
}

/* ---- Exportar Excel ---- */
function openExportModal(){ showExportModal = true; exportWorker = ""; render(); }
function closeExportModal(){ showExportModal = false; render(); }
function exportExcel(workerFilter){
  const base = workerFilter ? solicitudes.filter(s => s.worker_name === workerFilter) : solicitudes;
  const rows = base.map(s => ({
    Fecha: s.created_at, Trabajador: s.worker_name, Departamento: s.department, Estado: s.status,
    Motivo: s.motivo || "", Items: (s.solicitud_items||[]).map(it=>`${itemName(it.item_id)}${it.option_value?` (${it.option_value})`:''} x${it.qty}`).join("; "),
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Solicitudes");
  const suffix = workerFilter ? `_${workerFilter.replace(/\s+/g,'_')}` : "_todos";
  XLSX.writeFile(wb, `solicitudes_epp${suffix}_${Date.now()}.xlsx`);
  showExportModal = false; render();
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById("app");
  if(view === "loading"){ app.innerHTML = `<div class="loading-screen">Cargando…</div>`; return; }
  if(view === "login"){ app.innerHTML = renderAuthShell(renderLoginForm()); attachAuthEvents(); return; }
  if(view === "signup"){ app.innerHTML = renderAuthShell(renderSignupForm()); attachAuthEvents(); return; }
  if(view === "forgot"){ app.innerHTML = renderAuthShell(renderForgotForm()); attachAuthEvents(); return; }
  renderMainApp();
}

function attachAuthEvents(){
  document.querySelectorAll("[data-authtab]").forEach(el=>el.addEventListener("click", ()=>{ view = el.dataset.authtab; authError=""; authOk=""; render(); }));
  document.getElementById("go-forgot")?.addEventListener("click", ()=>{ view="forgot"; authError=""; authOk=""; render(); });
  document.getElementById("back-login")?.addEventListener("click", ()=>{ view="login"; authError=""; authOk=""; render(); });

  const le = document.getElementById("login-email"), lp = document.getElementById("login-password");
  if(le) le.addEventListener("input", e=>loginData.email=e.target.value);
  if(lp) lp.addEventListener("input", e=>loginData.password=e.target.value);
  document.getElementById("login-submit")?.addEventListener("click", doLogin);

  const map = { "su-nombre":"nombre","su-rut":"rut","su-dept":"departamento","su-email":"email","su-password":"password" };
  Object.entries(map).forEach(([elId,key])=>{
    const el = document.getElementById(elId);
    if(el) el.addEventListener("input", e=>signupData[key]=e.target.value);
  });
  document.getElementById("signup-submit")?.addEventListener("click", doSignup);

  const fe = document.getElementById("forgot-email");
  if(fe) fe.addEventListener("input", e=>forgotEmail=e.target.value);
  document.getElementById("forgot-submit")?.addEventListener("click", doForgot);
}

function attachAppEvents(){
  document.getElementById("menu-btn")?.addEventListener("click", ()=>{ menuOpen=true; render(); });
  document.getElementById("menu-close")?.addEventListener("click", ()=>{ menuOpen=false; render(); });
  document.getElementById("side-backdrop")?.addEventListener("click", ()=>{ menuOpen=false; render(); });
  document.getElementById("logout-btn")?.addEventListener("click", doLogout);
  document.getElementById("refresh-btn")?.addEventListener("click", refresh);
  document.getElementById("fab-btn")?.addEventListener("click", ()=>{ menuOpen=false; openForm(); });
  document.getElementById("notif-btn")?.addEventListener("click", openNotifs);
  document.getElementById("notif-close")?.addEventListener("click", ()=>{ showNotifs=false; render(); });
  document.getElementById("notif-overlay")?.addEventListener("click", (e)=>{ if(e.target.id==="notif-overlay"){ showNotifs=false; render(); } });
  document.getElementById("export-btn")?.addEventListener("click", openExportModal);
  document.getElementById("export-close")?.addEventListener("click", closeExportModal);
  document.getElementById("export-overlay")?.addEventListener("click", (e)=>{ if(e.target.id==="export-overlay") closeExportModal(); });
  document.querySelectorAll("[data-export-worker]").forEach(el=>el.addEventListener("click", ()=>exportExcel(el.dataset.exportWorker)));

  document.getElementById("open-inventory")?.addEventListener("click", ()=>{ menuOpen=false; showInventory=true; render(); });
  document.getElementById("inv-close")?.addEventListener("click", ()=>{ showInventory=false; render(); });
  document.getElementById("inv-overlay")?.addEventListener("click", (e)=>{ if(e.target.id==="inv-overlay"){ showInventory=false; render(); } });
  document.getElementById("new-item-btn")?.addEventListener("click", openNewItemEditor);
  document.querySelectorAll("[data-edit-item]").forEach(el=>el.addEventListener("click", ()=>openEditItemEditor(el.dataset.editItem)));
  document.querySelectorAll("[data-delete-item]").forEach(el=>el.addEventListener("click", ()=>deleteItem(el.dataset.deleteItem)));
  document.querySelectorAll("[data-stock-inc]").forEach(el=>el.addEventListener("click", ()=>adjustStock(el.dataset.stockInc, 1)));
  document.querySelectorAll("[data-stock-dec]").forEach(el=>el.addEventListener("click", ()=>adjustStock(el.dataset.stockDec, -1)));

  document.getElementById("item-editor-close")?.addEventListener("click", closeItemEditor);
  document.getElementById("item-editor-overlay")?.addEventListener("click", (e)=>{ if(e.target.id==="item-editor-overlay") closeItemEditor(); });
  document.getElementById("save-item-btn")?.addEventListener("click", saveItemEditor);
  const ien = document.getElementById("ie-name"), ieu = document.getElementById("ie-unit"), ies = document.getElementById("ie-stock");
  if(ien) ien.addEventListener("input", e=>setEditorField("name", e.target.value));
  if(ieu) ieu.addEventListener("input", e=>setEditorField("unit", e.target.value));
  if(ies) ies.addEventListener("input", e=>setEditorField("stock", e.target.value));
  document.querySelectorAll("[data-requires]").forEach(el=>el.addEventListener("click", ()=>setEditorRequires(el.dataset.requires==="si")));
  document.querySelectorAll("[data-opttype]").forEach(el=>el.addEventListener("click", ()=>setEditorOptionType(el.dataset.opttype)));
  document.querySelectorAll("[data-size-check]").forEach(el=>el.addEventListener("change", ()=>toggleEditorSize(el.dataset.sizeCheck)));

  document.getElementById("form-close")?.addEventListener("click", closeForm);
  document.getElementById("form-overlay")?.addEventListener("click", (e)=>{ if(e.target.id==="form-overlay") closeForm(); });
  document.getElementById("submit-form")?.addEventListener("click", submitForm);
  document.getElementById("motivo-input")?.addEventListener("input", e=>formMotivo=e.target.value);
  document.getElementById("foto-input")?.addEventListener("change", onFotoChange);

  document.querySelectorAll("[data-tab]").forEach(el=>el.addEventListener("click", ()=>setTab(el.dataset.tab)));
  document.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click", ()=>updateStatus(el.dataset.id, el.dataset.action)));
  document.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click", ()=>toggleFormItem(el.dataset.toggle)));
  document.querySelectorAll("[data-qty-inc]").forEach(el=>el.addEventListener("click", ()=>setFormQty(el.dataset.qtyInc, (formSelection[el.dataset.qtyInc]?.qty||1)+1)));
  document.querySelectorAll("[data-qty-dec]").forEach(el=>el.addEventListener("click", ()=>setFormQty(el.dataset.qtyDec, (formSelection[el.dataset.qtyDec]?.qty||1)-1)));
  document.querySelectorAll("[data-option-select]").forEach(el=>el.addEventListener("change", (e)=>setFormOption(el.dataset.optionSelect, e.target.value)));
}

/* ================= INIT ================= */
initAuth().then(()=>{ if(session) subscribeRealtime(); });

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
</body>
</html>
